# Supabase CLI config — DeskcommCRM
# Docs: https://supabase.com/docs/guides/cli/config
# Este arquivo é versionado. Segredos vivem em .env.local / Vercel.

project_id = "deskcomm-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3001/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false # Contas nascem somente pela Admin API após convite HMAC válido

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# Templates apontam para /auth/confirm (fluxo token_hash do @supabase/ssr).
# Self-host GoTrue: ver docs/deploy-selfhost (GOTRUE_MAILER_TEMPLATES_*).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail — DeskcommCRM"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefinir senha — DeskcommCRM"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Seu acesso foi liberado — DeskcommCRM"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso — DeskcommCRM"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail — DeskcommCRM"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} é seu código de verificação"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Sua senha foi alterada — DeskcommCRM"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Seu e-mail foi alterado — DeskcommCRM"
content_path = "./supabase/templates/email_changed_notification.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Nova verificação adicionada — DeskcommCRM"
content_path = "./supabase/templates/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Verificação removida — DeskcommCRM"
content_path = "./supabase/templates/mfa_factor_unenrolled_notification.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "Novo método de acesso vinculado — DeskcommCRM"
content_path = "./supabase/templates/identity_linked_notification.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "Método de acesso removido — DeskcommCRM"
content_path = "./supabase/templates/identity_unlinked_notification.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false # Não usamos Edge Functions no MVP
policy = "oneshot"

[analytics]
enabled = false
